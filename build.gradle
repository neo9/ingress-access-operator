plugins {
	id 'java'
	id 'org.graalvm.buildtools.native' version '0.10.6'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.0.11.RELEASE'
	id "org.sonarqube" version "3.3"
	id 'pl.allegro.tech.build.axion-release' version '1.13.6'
	id 'io.spring.javaformat'
}

group = 'io.neo9'
version = scmVersion.version
sourceCompatibility = '17'

tasks.matching { it.name.startsWith('checkFormatAot') || it.name.startsWith('formatAot') }.all { it.enabled = false }

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	maven { url 'https://repo.spring.io/release' }
	mavenCentral()
}

ext {
	javaOperatorVersion = '5.2.0'
	javaOperatorStarterVersion = '6.2.0'
	fabric8Version = '7.3.1'
	bouncycastleVersion = '1.70'

	// Native by default (matches historical releases). Set NATIVE_IMAGE=false for JVM.
	// Requires: AutoConfiguration.imports, OperatorRuntimeConfig destroyMethod=shutdown,
	// and -H:+AddAllCharsets (OkHttp UTF-32BE).
	buildNativeImage = ! "false".equalsIgnoreCase(System.getenv('NATIVE_IMAGE'))
}

if (buildNativeImage) {
	println "[plugins] Applying AOT plugin"
} else {
	println "[plugins] NOT applying AOT plugin"
}

configurations.all {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == 'io.fabric8') {
			details.useVersion fabric8Version
		}
	}
}

dependencies {
	implementation platform("io.fabric8:kubernetes-client-bom:${fabric8Version}")
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-logging'

	implementation "io.javaoperatorsdk:operator-framework-spring-boot-starter:${javaOperatorStarterVersion}"
	implementation "io.javaoperatorsdk:operator-framework:${javaOperatorVersion}"
	implementation 'io.fabric8:kubernetes-client'
	implementation "org.bouncycastle:bcprov-ext-jdk15on:${bouncycastleVersion}"
	implementation "org.bouncycastle:bcpkix-jdk15on:${bouncycastleVersion}"
	implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation "io.javaoperatorsdk:operator-framework-spring-boot-starter-test:${javaOperatorStarterVersion}"
}

test {
	useJUnitPlatform()
}

bootBuildImage {
	imageName   = "neo9sas/${project.name}:latest"
	if (buildNativeImage) {
		environment = [
				'BP_NATIVE_IMAGE'                : 'true',
				'BP_NATIVE_IMAGE_BUILD_ARGUMENTS': '-H:+AddAllCharsets --enable-https'
		]
	} else {
		// Native Build Tools plugin defaults bootBuildImage to native; force JVM off
		builder = 'paketobuildpacks/builder-jammy-base:latest'
		environment = [
				'BP_NATIVE_IMAGE': 'false'
		]
	}
}

subprojects {
    sonarqube {
        properties {
            property "sonar.sources", "src/main/java"
        }
    }
}
